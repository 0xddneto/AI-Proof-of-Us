name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Verify npm package version is published
        working-directory: mcp-server
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          registry_version="$(node -p "require('./server.json').packages[0].version")"

          if [ "$package_version" != "$registry_version" ]; then
            echo "package.json version ($package_version) must match server.json version ($registry_version)." >&2
            exit 1
          fi

          npm view "${package_name}@${package_version}" version

      - name: Publish server.json
        run: ../mcp-publisher publish
        working-directory: mcp-server
